events {
    worker_connections 1024;
}

http {
    upstream backend  { server backend:8000;  }
    upstream ml       { server ml:8001;        }
    upstream frontend { server frontend:3000;  }

    # HTTP → HTTPS 리다이렉트
    server {
        listen 80;
        server_name pmdrdocg.store;
        return 301 https://$host$request_uri;
    }

    # HTTPS 메인 설정
    server {
        listen 443 ssl;
        server_name pmdrdocg.store;

        ssl_certificate     /etc/letsencrypt/live/pmdrdocg.store/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pmdrdocg.store/privkey.pem;

        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ml/ {
            proxy_pass http://ml/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/scanner/ {
            proxy_pass http://ml/ws/scanner/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /ws/ {
            proxy_pass http://backend/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://frontend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
